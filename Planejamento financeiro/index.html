<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planejamento financeiro</title>
  <meta name="description" content="Planejamento financeiro pessoal e familiar — 100% local, sem enviar dados para a internet.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231f6f6b'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    /* Aplica o tema salvo antes da primeira pintura (evita o "flash" claro no tema escuro). */
    try {
      var p = JSON.parse(localStorage.getItem('pf_prefs_v1') || '{}');
      if (p.tema === 'claro' || p.tema === 'escuro') document.documentElement.setAttribute('data-theme', p.tema);
    } catch (e) { /* sem localStorage: segue com o tema do sistema */ }
  </script>
</head>
<body>
  <div id="app"><p style="padding:24px">Carregando…</p></div>
  <noscript>Este app precisa de JavaScript.</noscript>
  <script src="vendor/echarts/echarts.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
